name: Publish

on:  # yamllint disable-line rule:truthy

  # postsubmit
  push:
    branches:
    - main
    paths:
    - 'tensorflow_federated/version.py'

  # manual
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  publish-release:
    name: Publish Release
    # Only if:
    # * Repository is not a fork.
    # * Branch is `main` (for workflow_dispatch trigger).
    if: |
      github.repository == 'google-parfait/tensorflow-federated'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # Required to create a release.
    outputs:
      release-tag: v${{ env.version }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4.1.7

    - name: Get the latest version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        latest_version="$(gh release view \
            --json "tagName" \
            --jq ".tagName" \
            | sed "s/^v//")"
        echo "latest_version=${latest_version}" >> $GITHUB_ENV

    - name: Get the version
      run: |
        version="$(sed --quiet \
            "s/^__version__ = '\(.*\)'$/\1/p" \
            "tensorflow_federated/version.py")"
        echo "version=${version}" >> $GITHUB_ENV

    - name: Get the description
      run: |
        description="$(sed --quiet \
            "/^## Release ${{ env.version }}$/,/^## Release /p" \
            "RELEASE.md" \
            | head --lines=-1 \
            | sed "s/^#//")"
        {
          echo "description<<EOF"
          echo "${description}"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Publish release
      if: ${{ env.latest_version != env.version }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ env.version }}" \
            --target="${{ github.sha }}" \
            --title="TensorFlow Federated ${{ env.version }}" \
            --notes="$(cat <<'EOF'
        ${{ env.description }}
        EOF
        )"

  build-package:
    name: Build Package (Python ${{ matrix.python-version }})
    needs: [publish-release]
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:

    - name: Install prerequisites
      run: |
        apt-get update
        apt-get install -y git curl tar

    - name: Install Bazelisk
      run: |
        curl -L https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64 -o /usr/local/bin/bazelisk
        chmod +x /usr/local/bin/bazelisk

    - name: Checkout repository
      uses: actions/checkout@v4.1.7
      with:
        ref: ${{ needs.publish-release.outputs.release-tag }}

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2.1.3
      with:
        credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
        create_credentials_file: true

    - name: Set up bazel repository cache
      uses: actions/cache@v4.0.2
      with:
        path: "~/.cache/bazel/"
        key: ${{ runner.os }}-bazel-py${{ matrix.python-version }}-${{ hashFiles('.bazelversion', '.bazelrc', 'WORKSPACE', 'requirements_lock_*.txt') }}
        restore-keys: |
          ${{ runner.os }}-bazel-py${{ matrix.python-version }}-
          ${{ runner.os }}-bazel-

    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install Python dependencies
      run: |
        pip install --upgrade "pip"

    - name: Build Python package
      run: |
        bazelisk run //tools/python_package:build_python_package \
            --repo_env=HERMETIC_PYTHON_VERSION=${{ matrix.python-version }} \
            --build_tag_filters="-nokokoro,-nopresubmit,-requires-gpu-sm90" \
            --google_credentials="${{ steps.auth.outputs.credentials_file_path }}" \
            --remote_cache="https://storage.googleapis.com/tensorflow-federated-bazel-cache/${{ github.job }}" \
            -- \
            --output_dir="${{ github.workspace }}/dist/"

    - name: Upload Python package
      uses: actions/upload-artifact@v4.3.3
      with:
        name: python-package-distributions-${{ matrix.python-version }}
        path: dist/*.whl

  test-package:
    name: Test Package (Python ${{ matrix.python-version }})
    needs: [build-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4.1.7
      with:
        ref: ${{ needs.publish-release.outputs.release-tag }}

    - name: Download Python package
      uses: actions/download-artifact@v4.1.7
      with:
        name: python-package-distributions-${{ matrix.python-version }}
        path: dist/

    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Ensure ELF inspection tools are installed
      run: |
        if ! command -v readelf >/dev/null 2>&1 || ! command -v nm >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y binutils
        fi

    - name: Test Python package
      run: |
        package="$(ls "${{ github.workspace }}/dist/"*".whl" | head -n1)"
        bash tools/python_package/test_python_package.sh --package="${package}"

  publish-package:
    name: Publish Package
    needs: [build-package, test-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write  # Required for trusted publishing.
    steps:

    - name: Download Python package
      uses: actions/download-artifact@v4.1.7
      with:
        pattern: python-package-distributions-*
        merge-multiple: true
        path: dist/

    - name: Publish Python package
      uses: pypa/gh-action-pypi-publish@v1.8.14
